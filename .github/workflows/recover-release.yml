name: Recover verified GitHub Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Already published stable npm version
        required: true
        type: string
      commit:
        description: Original full source commit SHA
        required: true
        type: string
      run_id:
        description: Original publish.yml run containing npm-release-evidence
        required: true
        type: string

permissions:
  contents: read

# Serialize with normal publishing; recovery never changes npm or its dist-tags.
concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  recover:
    if: github.repository == 'amazing-fish/dsh-piano-nav' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_COMMIT: ${{ inputs.commit }}
      RELEASE_RUN_ID: ${{ inputs.run_id }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}
          path: release-source
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '10.17.1'
      - name: Validate original publishing run and retrieve its frozen artifact
        run: node scripts/recover-release.mjs --prepare
      - run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: release-source
      - name: Verify registry bytes and install-load contract, then resume Release
        run: node scripts/recover-release.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recovered-release-evidence
          path: |
            release-source/artifacts/package-manifest.json
            release-source/artifacts/registry-verification.json
            release-source/artifacts/*.tgz
