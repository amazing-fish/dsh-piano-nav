name: Complete verified 1.3.5 Release

# One-time recovery of the already uploaded and verified draft. Never publishes npm.
on:
  push:
    branches: [master]
    paths: [.github/workflows/complete-1.3.5.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: complete-release-1.3.5
  cancel-in-progress: false

jobs:
  complete:
    if: github.repository == 'amazing-fish/dsh-piano-nav' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify registry and existing draft assets, then publish the same Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict'
          import { createHash } from 'node:crypto'
          import { execFileSync } from 'node:child_process'
          const repo = 'amazing-fish/dsh-piano-nav'
          const source = 'ba7172d5adb3fa69b7b9f9725065e4b91e760a2c'
          const sha256 = '1f9fd712236fbcd407986b0ab7a84f7c158e8cea514c354c83d2ba3a8ab66c95'
          const endpoint = `repos/${repo}/releases/418090072`
          const api = (args, input) => JSON.parse(execFileSync('gh', ['api', ...args], { encoding: 'utf8', input }))
          const release = api([endpoint])
          assert.equal(release.tag_name, 'v1.3.5')
          assert.equal(release.prerelease, false)
          assert.equal(release.assets.length, 2)
          const expected = new Map([
            ['dsh-piano-nav-1.3.5.tgz', `sha256:${sha256}`],
            ['registry-verification.json', 'sha256:5d64317b603517fac58bf0270870499ac86e05a9cef4857727ff27fcb7a92515'],
          ])
          for (const asset of release.assets) {
            assert.equal(asset.digest, expected.get(asset.name), 'draft contains the verified asset bytes')
            assert.equal(asset.state, 'uploaded')
          }
          const response = await fetch('https://registry.npmjs.org/dsh-piano-nav', { signal: AbortSignal.timeout(30000) })
          assert.equal(response.status, 200)
          const registry = await response.json()
          assert.equal(registry['dist-tags'].latest, '1.3.5')
          const metadata = registry.versions['1.3.5']
          assert.equal(metadata.repository.url, `git+https://github.com/${repo}.git`)
          assert.equal(metadata.dist.tarball, 'https://registry.npmjs.org/dsh-piano-nav/-/dsh-piano-nav-1.3.5.tgz')
          const download = await fetch(metadata.dist.tarball, { signal: AbortSignal.timeout(30000) })
          assert.equal(download.status, 200)
          const bytes = Buffer.from(await download.arrayBuffer())
          assert.equal(bytes.length, 111193)
          assert.equal(createHash('sha256').update(bytes).digest('hex'), sha256)
          assert.equal(`sha512-${createHash('sha512').update(bytes).digest('base64')}`, metadata.dist.integrity)
          const result = release.draft ? api(['--method', 'PATCH', endpoint, '--input', '-'], JSON.stringify({
            draft: false, prerelease: false, make_latest: 'true', target_commitish: source,
          })) : release
          assert.equal(result.draft, false)
          assert.equal(result.target_commitish, source)
          const tag = api([`repos/${repo}/git/ref/tags/v1.3.5`])
          assert.equal(tag.object.type, 'commit')
          assert.equal(tag.object.sha, source)
          console.log(JSON.stringify({ url: result.html_url, version: '1.3.5', source, sha256 }))
          JS
