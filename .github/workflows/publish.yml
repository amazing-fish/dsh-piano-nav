name: Publish verified npm package

on:
  workflow_run:
    workflows: [Navigator compatibility]
    branches: [master]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: Stable package version to publish
        required: true
        type: string
      commit:
        description: Expected full master commit SHA
        required: true
        type: string

permissions:
  contents: read

concurrency:
  # Ignore unrelated/failed completions without replacing a queued release.
  group: ${{ (github.event_name == 'workflow_dispatch' || github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository) && 'npm-publish' || format('ignored-publish-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  resolve:
    if: >-
      github.repository == 'amazing-fish/dsh-piano-nav' && github.ref == 'refs/heads/master' &&
      (github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      publish: ${{ steps.release.outputs.publish }}
      version: ${{ steps.release.outputs.version }}
      commit: ${{ steps.release.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || inputs.commit }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        if: github.event_name == 'workflow_run'
        with:
          name: release-intent
          path: artifacts
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
      - id: release
        run: node scripts/release-trigger.mjs resolve

  publish:
    needs: resolve
    if: needs.resolve.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
      RELEASE_COMMIT: ${{ needs.resolve.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.commit }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - uses: pnpm/action-setup@v4
        with:
          version: '10.17.1'
      - run: node scripts/release-preflight.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - run: pnpm test:package
      - name: Publish the tested tarball with OIDC
        env:
          REQUIRE_RELEASE_ARTIFACT: 'true'
        run: |
          node scripts/release-preflight.mjs
          npm publish "./artifacts/dsh-piano-nav-${RELEASE_VERSION}.tgz" --access public --tag latest --registry=https://registry.npmjs.org
      - run: node scripts/verify-published.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: npm-release-evidence
          path: |
            artifacts/package-manifest.json
            artifacts/registry-verification.json
            artifacts/*.tgz

  github-release:
    needs: [resolve, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
      RELEASE_COMMIT: ${{ needs.resolve.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.commit }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: npm-release-evidence
          path: artifacts
      - run: node scripts/github-release-notes.mjs
      - name: Publish versioned GitHub Release for market update notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${RELEASE_VERSION}" \
            "artifacts/dsh-piano-nav-${RELEASE_VERSION}.tgz" \
            artifacts/registry-verification.json \
            --repo "$GITHUB_REPOSITORY" --target "$RELEASE_COMMIT" \
            --title "v${RELEASE_VERSION}" --notes-file artifacts/github-release-notes.md
